{%- extends "rideshare/templates/rs_base.html" -%}
{%- block rs_body -%}
<div class="rs-container" style="max-width:440px;">
  <div class="rs-card" style="margin-top:48px;">
    <div class="rs-card-h" style="flex-direction:column; align-items:flex-start;">
      <h2 style="margin:0; font-weight:800; letter-spacing:-0.02em;">What's your number?</h2>
      <p style="color:var(--rs-text-soft); margin:6px 0 0;">
        Sign in or create a Rideshare account using your mobile number.
      </p>
    </div>

    <form id="rs-login-form" autocomplete="off">
      <div class="rs-field">
        <label class="rs-label" for="mobile">Mobile number</label>
        <div style="display:flex; gap:0; border:1.5px solid var(--rs-border-strong); border-radius:10px; overflow:hidden; background:var(--rs-bg-soft);">
          <div style="display:flex; align-items:center; gap:6px; padding:0 14px; border-right:1px solid var(--rs-border); font-weight:700; color:var(--rs-text);">
            <span>🇮🇳</span><span>+91</span>
          </div>
          <input class="rs-input" id="mobile" name="mobile" inputmode="numeric"
                 placeholder="98765 43210" required
                 maxlength="15"
                 style="border:0; border-radius:0; background:transparent; padding:14px 16px; font-weight:600;">
        </div>
      </div>
      <button class="rs-btn rs-btn-primary rs-btn-block" type="submit" id="rs-submit">Continue →</button>
    </form>

    <p style="text-align:center; color:var(--rs-text-soft); margin-top:18px; font-size:13px;">
      No password needed. We use your phone number to sign you in.
    </p>
  </div>

  <div style="text-align:center; margin-top:24px; color:var(--rs-text-soft); font-size:13px;">
    Want a faster booking experience?
    <a href="#" style="color:var(--rs-text); text-decoration:underline;">Get the app</a>
  </div>
</div>

<script>
frappe.ready(function () {
  const form = document.getElementById("rs-login-form");
  const submit = document.getElementById("rs-submit");
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next") || "/me";
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    let mobile = document.getElementById("mobile").value.trim().replace(/\D/g, "");
    if (mobile.length < 10) {
      rs.toast("Enter a valid 10-digit mobile number", "error");
      return;
    }
    submit.disabled = true;
    submit.textContent = "Signing in…";
    try {
      const res = await rs.api("rideshare.api.auth.login_or_signup", { mobile_no: mobile });
      rs.toast(res.is_new ? "Account created — welcome!" : "Logged in", "success");
      setTimeout(() => { window.location.href = next; }, 400);
    } catch (err) {
      rs.toast(err.message || "Login failed", "error");
      submit.disabled = false;
      submit.textContent = "Continue →";
    }
  });
});
</script>
{%- endblock -%}
